<footer class="footer">
  <div class="container footer__inner">
    <a class="footer__logo" routerLink="/" aria-label="Home">LL</a>

    <nav class="footer__nav" aria-label="Footer">
      <a href="/#about" (click)="goTo('about', $event)">{{ 'nav.about' | translate }}</a>
      <a href="/#skills" (click)="goTo('skills', $event)">{{ 'nav.skills' | translate }}</a>
      <a href="/#projects" (click)="goTo('projects', $event)">{{ 'nav.portfolio' | translate }}</a>
      <a href="/#contact" (click)="goTo('contact', $event)">{{ 'nav.contact' | translate }}</a>
      <a routerLink="/impressum">{{ 'footer.impressum' | translate }}</a>
      <a routerLink="/privacy">{{ 'footer.privacy' | translate }}</a>
    </nav>

    <div class="footer__meta">
      <p>{{ 'footer.copy' | translate }} {{ year }}</p>
      <a class="footer__top" href="/#top" (click)="goTo('top', $event)">{{ 'footer.toTop' | translate }}</a>
    </div>
  </div>
</footer>
