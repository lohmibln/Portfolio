<section class="about" id="about">
  <div class="container about__inner">
    <div class="about__tags">
      <span class="tag tag--yellow">{{ 'about.tag1' | translate }}</span>
      <span class="tag tag--blue">{{ 'about.tag2' | translate }}</span>
      <span class="tag tag--salmon">{{ 'about.tag3' | translate }}</span>
    </div>

    <div class="about__content">
      <h2 class="section-title">
        {{ 'about.title' | translate }}
        <span class="underline-stroke underline-stroke--blue" aria-hidden="true"></span>
      </h2>
      <p class="section-text">{{ 'about.text' | translate }}</p>
      <button type="button" class="btn about__more">{{ 'about.readMore' | translate }}</button>
    </div>
  </div>

  <div class="torn-edge torn-edge--bottom-dark" aria-hidden="true"></div>
</section>
