<section class="skills" id="skills">
  <div class="container">
    <div class="skills__header">
      <h2 class="skills__title">
        <span>{{ 'skills.title' | translate }}</span>
      </h2>
      <p class="skills__intro">{{ 'skills.intro' | translate }}</p>
      <p class="skills__hint">{{ 'skills.peelHint' | translate }}</p>
    </div>

    <ul class="skills__grid">
      @for (skill of skills; track skill) {
        <li>
          <img
            class="skills__icon"
            [class.skills__icon--grey]="!isColored(skill)"
            [src]="'/img/' + skill + '.svg'"
            [alt]="skill"
          />
          <span>{{ skill }}</span>
        </li>
      }
    </ul>
  </div>

  <div class="torn-edge torn-edge--bottom" aria-hidden="true"></div>
</section>
