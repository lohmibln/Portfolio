<section class="hero" id="top">
  <div class="container hero__inner">
    <div class="hero__copy">
      <span class="hero__hello">{{ 'hero.hello' | translate }}</span>
      <h1 class="hero__title">
        <span>{{ 'hero.title' | translate }}</span>
        <span>{{ 'hero.titleAccent' | translate }}</span>
      </h1>
      <a class="btn btn--ghost" href="#contact">{{ 'hero.cta' | translate }}</a>
    </div>

    <figure class="hero__polaroid">
      <div class="hero__photo visual-placeholder" aria-hidden="true">Photo</div>
      <figcaption>{{ 'hero.photoName' | translate }}</figcaption>
    </figure>
  </div>

  <aside class="hero__social" aria-label="Social links">
    <a href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GH</a>
    <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">IN</a>
    <a href="mailto:hello@example.com" aria-label="Email">Mail</a>
  </aside>

  <div class="torn-edge torn-edge--bottom" aria-hidden="true"></div>
</section>
